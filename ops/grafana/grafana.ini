; Local Grafana for Set Builder. Started by scripts/metrics.sh, which sets the GF_PATHS_* folders to ops/.
[server]
http_addr = 127.0.0.1
http_port = 3000

; Anyone on this machine can view without logging in. Log in as admin/admin to edit.
[auth.anonymous]
enabled = true
org_role = Viewer

[dashboards]
default_home_dashboard_path = ${SETBUILDER_OPS}/grafana/dashboards/set-builder.json

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false
