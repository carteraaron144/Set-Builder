spring:
  application:
    name: setbuilder

setbuilder:
  # Asset packs: <packs-dir>/<id>/pack.json. Relative to the working directory (server/ for bootRun).
  packs-dir: ../packs

---
spring:
  datasource:
    url: ${SETBUILDER_DB_URL:jdbc:postgresql://localhost:5432/setbuilder}
    username: ${SETBUILDER_DB_USER:${USER}}
    password: ${SETBUILDER_DB_PASSWORD:}
  mvc:
    # Errors come back as RFC 9457 problem JSON, so the web app can show the server's reason.
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 65MB

---
# Actuator: health and metrics on a separate, localhost-only port (no auth yet). Prometheus scrapes /actuator/prometheus.
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: setbuilder
    distribution:
      percentiles-histogram:
        http.server.requests: true
